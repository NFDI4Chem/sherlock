# This workflow will perform following actions when code is pushed to the development branch:
# - Run tests and linting checks (can be enabled via needs: test_and_lint)
# - Build and push sherlock Docker image with layer caching for faster builds
# - Push images to Docker Hub under namespace nfdi4chem with latest tag
# - Prevent redundant builds using concurrency control
#
# Maintainers:
#   - name: Nisha Sharma
#   - email: nisha.sharma@uni-jena.de

name: Build and Publish to Development

on:
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'DEPLOY' to confirm development deployment"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHERLOCK_REPOSITORY_NAME: sherlock
  REPOSITORY_NAMESPACE: nfdi4chem
  RELEASE_TAG: latest

jobs:
  build_and_push_to_registry:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm == 'DEPLOY' }}
    name: Build and Push Docker image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      # Clone repository code to runner
      - name: Check out the repo
        uses: actions/checkout@v4

      # Fetch PyLSD and stage it to right folder
      - name: Fetch PyLSD
        run: |
          curl -sL -o pylsd.tar.gz "https://raw.githubusercontent.com/nuzillard/PyLSD/4db027118acf3d9c77d3a5f8dc9ce51dd3cbd468/pylsd-linux-a8.tar.gz"
          tar -xzf pylsd.tar.gz -C data/lsd
          mv data/lsd/PyLSD-a8 data/lsd/PyLSD
          cp data/lsd/PyLSD_Variant_mod/defaults.py data/lsd/PyLSD/Variant/defaults.py
          cp data/lsd/PyLSD_Variant_mod/lsd.py data/lsd/PyLSD/Variant/lsd.py
          rm pylsd.tar.gz

      # Enable multi-architecture builds via QEMU emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Enable advanced Docker build features (required for caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with Docker Hub for image push access
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build main sherlock image with registry caching for faster builds
      - name: Build and Push Sherlock Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REPOSITORY_NAMESPACE }}/${{ env.SHERLOCK_REPOSITORY_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.REPOSITORY_NAMESPACE }}/${{ env.SHERLOCK_REPOSITORY_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPOSITORY_NAMESPACE }}/${{ env.SHERLOCK_REPOSITORY_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REPOSITORY_NAMESPACE }}/${{ env.SHERLOCK_REPOSITORY_NAME }}:buildcache,mode=max
